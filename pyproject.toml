[project]
name = "financerag-bench"
version = "0.1.0"
description = "RAG & Agentic RAG benchmark on FinanceBench — from naive to multi-agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PDF parsing
    "pymupdf>=1.24.0",
    "docling>=2.0.0",
    # Data handling
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # LLM abstraction
    "litellm>=1.40.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # BM25
    "rank-bm25>=0.2.2",
    # Evaluation
    "ragas>=0.1.0",
    # Orchestration
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Observability
    "langfuse>=2.0.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Utilities
    "tqdm>=4.66.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
]
demo = [
    "gradio>=4.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "eval: marks evaluation tests (require API keys)",
]
