services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  # Local LLM/agent tracing UI + OTLP collector (no account, all local).
  # UI at http://localhost:6006 ; the app exports spans to it via OTLP.
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"  # UI + OTLP over HTTP (/v1/traces)
      - "4317:4317"  # OTLP over gRPC
    restart: unless-stopped

volumes:
  qdrant_data:
