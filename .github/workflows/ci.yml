name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Never fetch a managed interpreter: use the one setup-python put on the runner.
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.10"
          enable-cache: true

      # Use the runner's cached Python rather than uv python install, which pulls a
      # standalone CPython from a third-party GitHub release on every run -- a 504
      # there fails the build for reasons unrelated to the code.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/

      - name: Run fast tests
        run: uv run pytest tests/ -v -m "not slow and not eval"
