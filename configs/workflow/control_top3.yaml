# Control row: the three best-ranked passages, no grader at all.
#
# Needed for attribution. The floor tops the grader's selection up to three passages
# and the grader keeps fewer than three on most questions, so the context often ends up
# close to "the three best-ranked passages". Without this row a gain could not be told
# apart from what the floor alone achieves.
chunks_path: data/processed/docling/chunked/hybrid/chunks_1024.jsonl
collection_name: docling_hybrid_1024_bge-m3
retriever: replay
replay_path: data/processed/prompts/prompts_reranked-dense_docling_hybrid_1024_bge-m3_docscoped_pf50_k20.jsonl
doc_scoped: true
k: 3
grading:
  enabled: false
calculator:
  enabled: false
llm:
  model: ollama_chat/granite4.1:8b
  temperature: 0.0
  max_tokens: 1024
  num_ctx: 12288
