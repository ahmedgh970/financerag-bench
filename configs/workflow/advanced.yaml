# Ablation baseline: dense k=20 -> generate, every node disabled.
# Same graph as the other rows, so a difference between rows is attributable to the
# node under test and not to a different code path.
#
# num_ctx is pinned per row, not globally: this row feeds all 20 retrieved chunks to
# the generator (~21k tokens at the observed maximum), so it needs the larger window.
# Pinning it to the filtered row's 12288 would truncate this prompt -- and Ollama
# truncates from the TOP, dropping the grounding instructions first -- which would
# handicap the baseline and flatter the grading row.
chunks_path: data/processed/docling/chunked/hybrid/chunks_1024.jsonl
collection_name: docling_hybrid_1024_bge-m3
retriever: dense
doc_scoped: true
k: 20
grading:
  enabled: false
calculator:
  enabled: false
max_rewrites: 2
llm:
  model: ollama_chat/granite4.1:8b
  temperature: 0.0
  max_tokens: 1024
  num_ctx: 24576
