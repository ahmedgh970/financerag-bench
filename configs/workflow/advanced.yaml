# Ablation baseline: the same stored retrieval, every node disabled -> retrieve then
# generate. Its prompt is byte-identical to the naive pipeline's on all 150 questions,
# so its answers are the ones already generated and judged as
# reranked_..._granite4.1:8b_k20 (65.3% equivalent). Kept here as the reproducible
# definition of the row; running it would recompute an answer already on disk.
chunks_path: data/processed/docling/chunked/hybrid/chunks_1024.jsonl
collection_name: docling_hybrid_1024_bge-m3
retriever: replay
replay_path: data/processed/prompts/prompts_reranked-dense_docling_hybrid_1024_bge-m3_docscoped_pf50_k20.jsonl
doc_scoped: true
k: 20
grading:
  enabled: false
calculator:
  enabled: false
llm:
  model: ollama_chat/granite4.1:8b
  temperature: 0.0
  max_tokens: 1024
  num_ctx: 24576
