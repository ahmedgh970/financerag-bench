# Ablation row: dense k=20, reordered by the cross-encoder, then graded 0-3.
# Differs from advanced.yaml by the grading switch (and by the reordering, which at
# prefetch = k changes only the order of the passages, never which ones are retrieved).
#
# Retrieval: prefetch 20 with k 20 means the cross-encoder reorders the twenty dense
# candidates rather than selecting among fifty. The grader still sees all twenty; the
# ranking only decides which passages the floor draws on.
chunks_path: data/processed/docling/chunked/hybrid/chunks_1024.jsonl
collection_name: docling_hybrid_1024_bge-m3
retriever: reranked
base_retriever: dense
rerank_prefetch: 20
doc_scoped: true
k: 20
grading:
  enabled: true
  keep_threshold: 2   # UMBRELA: 2 = holds part of what the answer is built from
  min_chunks: 3       # 0 = no floor, 1 = rescue an empty selection only, 3 = always three
  low_confidence_below: 2
calculator:
  enabled: false
llm:
  model: ollama_chat/granite4.1:8b
  temperature: 0.0
  max_tokens: 1024
  num_ctx: 12288
