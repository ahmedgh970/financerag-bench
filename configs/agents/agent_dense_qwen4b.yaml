# Agentic RAG: depth-escalating dense retrieval (5 -> 10 -> 20) + calculator,
# generated by qwen3.5:4b. Same corpus as the naive baseline (ADR 0002) so the
# answers are directly comparable; the only difference is the agent loop.
chunks_path: data/processed/docling/chunked/hybrid/chunks_1024.jsonl
collection_name: docling_hybrid_1024_bge-m3
retriever: dense
doc_scoped: true
depths: [5, 10, 20]
num_ctx: 32768
recursion_limit: 12
llm:
  model: ollama_chat/qwen3.5:4b
  temperature: 0.0
  max_tokens: 1024
