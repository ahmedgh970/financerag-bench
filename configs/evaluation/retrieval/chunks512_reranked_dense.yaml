# Retrieval eval on the docling-hybrid-512 corpus. Dense retrieval reranked by a cross-encoder (prefetch 50), doc-scoped -- ADR 0001's default.
# make eval-retrieval CONFIG=configs/evaluation/retrieval/chunks512_reranked_dense.yaml
chunks_path: data/processed/docling/chunked/hybrid/chunks_512.jsonl
collection_name: docling_hybrid_512_bge-m3
retriever: reranked
base_retriever: dense
reranker_model: BAAI/bge-reranker-v2-m3
rerank_prefetch: 50
doc_scoped: true
