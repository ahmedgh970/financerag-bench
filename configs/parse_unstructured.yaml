# Parse stage: Unstructured. Run once -> data/processed/unstructured/parsed/{doc_id}.json
# make parse CONFIG=configs/parse_unstructured.yaml

parser: unstructured
parser_params:
  strategy: hi_res              # hi_res layout model + tables (fair comparison vs Docling) or ``"fast"`` (native text only, no tables, much quicker)
  infer_table_structure: true
  languages: [eng]

pdf_dir: data/pdfs
