# RAG naïf : reranked(dense) -> LiteLLM (Groq Llama 3.1 8B).
# k=5 + un plus petit modèle : llama-3.3-70b-versatile en tier gratuit Groq
# plafonne à ~100k tokens/jour (~20 requêtes à k=10) ; llama-3.1-8b-instant a
# un quota séparé et moins coûteux à servir.
chunks_path: data/processed/docling/chunked/hybrid/chunks_512.jsonl
collection_name: docling_hybrid_bge-m3
retriever: reranked
base_retriever: dense
doc_scoped: true
k: 5
llm:
  model: groq/llama-3.1-8b-instant
