# Parse stage: Docling. Run once -> data/processed/docling/parsed/{doc_id}.json
# make parse CONFIG=configs/parse_docling.yaml

parser: docling
parser_params:
  do_ocr: false              # SEC filings are born-digital; OCR adds time, not text
  do_table_structure: true   # tables carry the answers on FinanceBench
  table_mode: accurate       # "accurate" | "fast"

pdf_dir: data/pdfs
